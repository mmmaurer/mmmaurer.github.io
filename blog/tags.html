<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the theme before the first paint to avoid a light flash. -->
    <script>
        (() => {
            try {
                const stored = localStorage.getItem('theme');
                const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = stored || (dark ? 'dark' : 'light');
            } catch (_) { /* private mode: keep the default theme */ }
        })();
    </script>

    <title>Tags — Maximilian Maurer</title>
    <meta name="description" content="Browse blog posts by tag.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbfbfc">

    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../assets/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="../styles.css">

    <!-- Chrome can prerender pages on hover, making navigation instant. -->
    <script type="speculationrules">
        {
            "prerender": [{
                "source": "document",
                "where": { "selector_matches": "a[href]:not([target]):not([download])" },
                "eagerness": "moderate"
            }]
        }
    </script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
        <nav class="sidebar" id="site-nav"></nav>

        <main class="content" id="main" tabindex="-1">
            <header class="page-header">
                <h1>Browse by tag</h1>
            </header>

            <section class="section">

                <div class="tags-controls">
                    <input
                        type="search"
                        id="search-input"
                        class="tag-search-input"
                        placeholder="Search posts by title or content…"
                        aria-label="Search posts"
                    >
                    <div class="tag-cloud" id="tag-cloud"></div>
                </div>

                <div id="active-filter" class="active-filter" hidden>
                    Filtering by tag:
                    <span id="active-tag-label" class="active-tag-label"></span>
                    <button id="clear-filter" class="clear-filter" aria-label="Clear tag filter">✕</button>
                </div>

                <div class="blog-list" id="post-list"></div>

                <p id="no-results" class="no-results" hidden>No posts match your search.</p>
            </section>
        </main>
    </div>

    <script>
        // ── Blog post registry ──────────────────────────────────────────────
        // Add an entry here whenever you publish a new post.
        const POSTS = [
            {
                title: "Example Blog Post (ex2)",
                url: "ex2.html",
                date: "May 2, 2026",
                tags: ["blog"],
                excerpt: "This is only for testing purposes. It serves as a template for future posts and demonstrates the structure and formatting that can be used in our blogging platform.",
            },
        ];

        // ── State ──────────────────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        let activeTag = params.get('tag') || null;
        let searchQuery = '';

        // ── DOM refs ───────────────────────────────────────────────────────
        const tagCloud      = document.getElementById('tag-cloud');
        const postList      = document.getElementById('post-list');
        const noResults     = document.getElementById('no-results');
        const activeFilter  = document.getElementById('active-filter');
        const activeLabel   = document.getElementById('active-tag-label');
        const clearBtn      = document.getElementById('clear-filter');
        const searchInput   = document.getElementById('search-input');

        // ── Helpers ────────────────────────────────────────────────────────
        const allTags = [...new Set(POSTS.flatMap(p => p.tags))].sort();
        let tagButtons = [];

        function setTag(tag) {
            activeTag = tag;
            const url = new URL(location.href);
            if (tag) url.searchParams.set('tag', tag);
            else url.searchParams.delete('tag');
            history.replaceState(null, '', url);
            syncTags();
            updateActiveFilter();
            renderPosts();
        }

        function renderTags() {
            tagButtons = allTags.map(tag => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tag-filter-btn';
                btn.textContent = tag;
                btn.addEventListener('click', () => setTag(tag === activeTag ? null : tag));
                return btn;
            });
            tagCloud.replaceChildren(...tagButtons);
            syncTags();
        }

        function syncTags() {
            tagButtons.forEach((btn, i) => {
                const active = allTags[i] === activeTag;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', String(active));
            });
        }

        function updateActiveFilter() {
            activeFilter.hidden = !activeTag;
            activeLabel.textContent = activeTag || '';
        }

        function buildPostEl(post) {
            const article = document.createElement('article');
            article.className = 'blog-entry';
            article.innerHTML = `
                <h3><a href="${post.url}">${post.title}</a></h3>
                <div class="blog-meta">
                    <span class="blog-date">${post.date}</span>
                    <span class="blog-tags">${
                        post.tags.map(t =>
                            `<a href="tags.html?tag=${encodeURIComponent(t)}" class="blog-tag">${t}</a>`
                        ).join('')
                    }</span>
                </div>
                <p class="blog-excerpt">${post.excerpt}</p>
                <a href="${post.url}" class="read-more">Read more</a>
            `;
            return article;
        }

        function renderPosts() {
            const q = searchQuery.trim().toLowerCase();

            const visible = POSTS.filter(post => {
                const tagMatch  = !activeTag || post.tags.includes(activeTag);
                const textMatch = !q ||
                    post.title.toLowerCase().includes(q) ||
                    post.excerpt.toLowerCase().includes(q) ||
                    post.tags.some(t => t.toLowerCase().includes(q));
                return tagMatch && textMatch;
            });

            postList.replaceChildren(...visible.map(buildPostEl));
            noResults.hidden = visible.length > 0;
        }

        // ── Event listeners ────────────────────────────────────────────────
        clearBtn.addEventListener('click', () => setTag(null));

        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            renderPosts();
        });

        // ── Initial render ─────────────────────────────────────────────────
        renderTags();
        updateActiveFilter();
        renderPosts();
    </script>
    <script src="../site.js" defer></script>
</body>
</html>
