<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Blog Post (ex2) - Maximilian Maurer's Website</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <!-- Side Navigation -->
        <nav class="sidebar" id="site-nav"></nav>

        <!-- Main Content -->
        <main class="content">
            <!-- Blog Post Section -->
            <article class="section blog-post">
                <div class="blog-post-header">
                    <h1>Example Blog Post (ex2)</h1>
                    <div class="blog-post-meta">
                        <span class="blog-date">May 2, 2026</span>
                        <div class="blog-tags">
                            <a href="tags.html?tag=blog" class="blog-tag">blog</a>
                        </div>
                    </div>
                </div>

                <div class="blog-post-content">
                    <p>This is only for testing purposes. It serves as a template for future posts and demonstrates the structure and formatting that can be used in our blogging platform.</p>
                </div>

                <div class="blog-post-footer">
                    <a href="../blog.html" class="back-to-blog">← Back to Blog</a>
                </div>
            </article>
        </main>
    </div>
    <script src="../site.js" defer></script>
</body>
</html>
